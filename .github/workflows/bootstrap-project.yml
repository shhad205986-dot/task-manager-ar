name: Bootstrap project files

on:
  push:
    paths:
      - bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          mkdir .bootstrap
          cat bootstrap/xz-* | base64 --decode > project.tar.xz
          tar -xJf project.tar.xz -C .bootstrap
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .bootstrap \
            ! -name bootstrap \
            ! -name project.tar.xz \
            -exec rm -rf {} +
          cp -a .bootstrap/. .
          rm -rf .bootstrap bootstrap project.tar.xz
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Arabic task manager application"
            git push
          fi
